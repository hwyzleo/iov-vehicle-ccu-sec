# =============================================================================
# config/dev/common.yaml - CCU-SEC 开发夹具（公共基线）
# =============================================================================
# 仅用于本地开发/测试，不进入 ccu-sec-runtime install component。量产
# /etc/ccu/common.yaml 由 CCU-BUILD 部署。本文件提供 common.log.* 基线，
# 使 loadUnifiedConfig() 的 common 文件输入在开发环境可用。
# =============================================================================
common:
  log:
    schema_version: 1
    level: INFO
    strict: false
    async:
      enabled: true
      queue_size: 4096
      flush_interval_ms: 1000
    console:
      enabled: true
    file:
      enabled: false
      root: /var/log/ccu
      max_file_size_mb: 20
      max_files: 5
      total_budget_mb: 100
    redact:
      identifiers: mask
      payload_max_bytes: 256
    format: standard
