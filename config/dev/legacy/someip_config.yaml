# CCU-SEC SOME/IP 配置
# Service ID / Instance ID: 取自整车 SOME/IP Service Registry 统一分配（CCU-SEC-DSN-CR-003）
# Service ID: 0x1140, Instance ID: 0x0001, Transport: TCP, Port: 51140
service_id: 0x1140
instance_id: 0x0001

# Method ID 分配（CCU-SEC-DSN-CR-002 定案）
# Method ID 为 service-scoped，完整寻址: Message ID = Service ID << 16 | Method ID
# 0x0001–0x7FFF 用于 method（request/response）
# 0x8000–0xFFFF 预留 event/notification
# 标准命名: METHOD_<动作> 大写蛇形，一经分配不复用、不重编号
# Method IDs
get_seed_method_id: 0x0001
verify_key_method_id: 0x0002
derive_ota_session_method_id: 0x0003
derive_by_uid_method_id: 0x0004
wrap_by_uid_method_id: 0x0005

# 端点配置 (SSOT: SOME/IP Service Registry)
# 传输类型: TCP (request/response 为主，需可靠传输)
# 端口: 51140 (CCU-SEC 专用端口，CCU-DIAG = 30501)
endpoint:
  port: 51140
  protocol: TCP
  unicast: "127.0.0.1"

# 服务发现配置 (本期静态配置，后续可扩展为动态 SD)
service_discovery:
  enabled: true
  mode: static  # static 或 dynamic
  multicast_address: "239.0.0.1"
  port: 30490
