# CGW-SEC SOME/IP 配置
# Service ID / Instance ID: 临时值，待 CGW 级 SOME/IP ID 分配计划统一指派
service_id: 0x1234
instance_id: 0x5678

# Method IDs
get_seed_method_id: 0x0001
verify_key_method_id: 0x0002
derive_ota_session_method_id: 0x0003
derive_by_uid_method_id: 0x0004
wrap_by_uid_method_id: 0x0005

# 端点配置 (SSOT: CGW 模块库属性)
# 传输类型: TCP (request/response 为主，需可靠传输)
# 端口: 30502 (CGW-SEC 专用端口，DIAG facade = 30501)
endpoint:
  port: 30502
  protocol: TCP
  unicast: "127.0.0.1"

# 服务发现配置 (本期静态配置，后续可扩展为动态 SD)
service_discovery:
  enabled: true
  mode: static  # static 或 dynamic
  multicast_address: "239.0.0.1"
  port: 30490
